<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slap Machine</title>
    <style>
        * {
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        .container {
            background: #16213e;
            padding: 2rem 2.5rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 0 #0f0f1f, 0 8px 30px rgba(0, 0, 0, 0.8);
            border: 4px solid #0f3460;
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #e94560;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 3px 3px 0 #0f0f1f;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .preview-area {
            background: #0f0f1f;
            border-radius: 16px;
            padding: 1rem;
            margin: 1.2rem 0 1.8rem;
            border: 4px solid #533483;
            min-height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #displayImg {
            max-width: 100%;
            max-height: 420px;
            border-radius: 8px;
            display: block;
            image-rendering: pixelated;
            box-shadow: 0 0 0 2px #0f3460;
            position: relative;
            z-index: 2;
        }

        /* ── COMIC EFFECTS ── */
        .effect-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .effect {
            position: absolute;
            font-weight: 900;
            text-transform: uppercase;
            opacity: 0;
            transform: scale(0.3) rotate(-5deg);
            font-family: 'Impact', 'Arial Black', 'Courier New', sans-serif;
            letter-spacing: 2px;
            text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            transition: none;
        }

        .effect.active {
            animation: comicPop 0.9s ease-out forwards;
        }

        @keyframes comicPop {
            0%   { opacity: 0; transform: scale(0.2) rotate(-15deg); }
            25%  { opacity: 1; transform: scale(1.8) rotate(8deg); }
            50%  { opacity: 1; transform: scale(1) rotate(-3deg); }
            75%  { opacity: 1; transform: scale(1.1) rotate(2deg); }
            100% { opacity: 0; transform: scale(1.3) rotate(0deg) translateY(-20px); }
        }

        /* different words, colours & positions */
        .pow {
            top: 8%;
            left: 2%;
            font-size: 4.8rem;
            color: #ffeb3b;
            text-shadow: 6px 6px 0 #d32f2f, 10px 10px 0 #b71c1c;
            transform: rotate(-12deg);
        }

        .ouch {
            bottom: 10%;
            right: 0%;
            font-size: 4rem;
            color: #ff5722;
            text-shadow: 5px 5px 0 #bf360c;
            transform: rotate(18deg);
        }

        .bam {
            top: 15%;
            right: 5%;
            font-size: 3.8rem;
            color: #00e5ff;
            text-shadow: 4px 4px 0 #00695c;
            transform: rotate(8deg);
        }

        .whack {
            bottom: 25%;
            left: 2%;
            font-size: 3.5rem;
            color: #e040fb;
            text-shadow: 4px 4px 0 #4a148c;
            transform: rotate(-20deg);
        }

        .star {
            top: 40%;
            left: 15%;
            font-size: 5rem;
            color: #ffd54f;
            text-shadow: none;
            transform: rotate(10deg);
        }

        .impact-lines {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, transparent 60%, rgba(255, 255, 255, 0.15) 80%, transparent 90%);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            border-radius: 50%;
        }
        .impact-lines.active {
            animation: flashImpact 0.4s ease-out 2;
        }
        @keyframes flashImpact {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        /* ── BUTTONS ── */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            background: #e94560;
            border: none;
            border-bottom: 6px solid #a02040;
            padding: 0.9rem 2.4rem;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.8rem;
            text-transform: uppercase;
            color: #fff;
            border-radius: 16px;
            cursor: pointer;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #5a1a2a;
            transition: 0.08s linear;
            flex: 1 1 180px;
            box-shadow: 0 4px 0 #0f0f1f;
            position: relative;
            z-index: 20;
        }

        .btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .btn:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            border-bottom-width: 2px;
            pointer-events: none;
        }

        .btn-secondary {
            background: #533483;
            border-bottom-color: #2e1a4a;
            text-shadow: 2px 2px 0 #1e0f30;
        }

        .status {
            margin-top: 1.2rem;
            color: #b0b0d0;
            font-size: 0.9rem;
            min-height: 1.6rem;
            letter-spacing: 0.5px;
        }

        .slap-shake {
            animation: shake 0.15s ease-in-out 3;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-8px, 6px) rotate(-4deg); }
            50% { transform: translate(8px, -6px) rotate(4deg); }
            75% { transform: translate(-4px, 3px) rotate(-2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .flash {
            animation: flash 0.2s ease 2;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }

        @media (max-width: 500px) {
            .container { padding: 1.2rem; }
            h1 { font-size: 1.6rem; }
            .btn { font-size: 1.4rem; padding: 0.7rem 1.2rem; }
            .pow { font-size: 3rem; }
            .ouch { font-size: 2.5rem; }
            .bam { font-size: 2.5rem; }
            .whack { font-size: 2.2rem; }
            .star { font-size: 3rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👋Slap Vedant</h1>

    <div class="preview-area">
        <img id="displayImg" src="" alt="preview" />

        <!-- Comic effect layer -->
        <div class="effect-container" id="effectContainer">
            <div class="effect pow">POW!</div>
            <div class="effect ouch">OUCH!</div>
            <div class="effect bam">BAM!</div>
            <div class="effect whack">WHACK!</div>
            <div class="effect star">💥</div>
            <div class="impact-lines" id="impactLines"></div>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn" id="slapBtn">🤛 SLAP!</button>
        <button class="btn btn-secondary" id="resetBtn">↺ Reset</button>
    </div>

    <div id="status" class="status">✅ ready — hit SLAP!</div>
</div>

<script>
    (function() {
        // ── YOUR CONTENT URIs ──
        const NORMAL_URI = "normal.png";
        const SLAPPED_URI = "slapped.png"
        // ── DOM refs ──
        const displayImg = document.getElementById('displayImg');
        const slapBtn = document.getElementById('slapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const status = document.getElementById('status');
        const effects = document.querySelectorAll('.effect');
        const impactLines = document.getElementById('impactLines');

        // ── state ──
        let slapTimer = null;

        // ── RANDOM EFFECT TRIGGER (1 to 3 random words, never all) ──
        function triggerEffects() {
            // clear all effects first
            effects.forEach(el => el.classList.remove('active'));

            // pick a random count: 1, 2, or 3
            const count = Math.floor(Math.random() * 3) + 1; // 1–3

            // pick random unique indices
            const indices = [];
            while (indices.length < count) {
                const rand = Math.floor(Math.random() * effects.length);
                if (!indices.includes(rand)) {
                    indices.push(rand);
                }
            }

            // activate only the chosen ones
            indices.forEach(i => {
                const el = effects[i];
                void el.offsetWidth; // force reflow
                el.classList.add('active');
            });

            // impact flash always triggers
            impactLines.classList.remove('active');
            void impactLines.offsetWidth;
            impactLines.classList.add('active');
        }

        function clearEffects() {
            effects.forEach(el => el.classList.remove('active'));
            impactLines.classList.remove('active');
        }

        // ── image helpers ──
        function showImage(src) {
            displayImg.src = src;
        }

        function goToNormal() {
            if (slapTimer) {
                clearTimeout(slapTimer);
                slapTimer = null;
            }
            showImage(NORMAL_URI);
            slapBtn.disabled = false;
            displayImg.classList.remove('slap-shake', 'flash');
            clearEffects();
            status.textContent = '😐 back to normal';
        }

        // ── slap action ──
        function slap() {
            if (slapTimer) {
                clearTimeout(slapTimer);
                slapTimer = null;
            }

            showImage(SLAPPED_URI);
            slapBtn.disabled = true;

            displayImg.classList.remove('slap-shake', 'flash');
            void displayImg.offsetWidth;
            displayImg.classList.add('slap-shake', 'flash');

            // 🎯 trigger RANDOM comic effects
            triggerEffects();

            status.textContent = '💢 SLAPPED! (reverting in 1s...)';

            slapTimer = setTimeout(() => {
                goToNormal();
                slapTimer = null;
            }, 1000);
        }

        // ── event listeners ──
        resetBtn.addEventListener('click', goToNormal);
        slapBtn.addEventListener('click', slap);

        // ── Keyboard shortcut (Space) ──
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                slap(); // re-slaps and resets timer if already slapped
            }
        });

        // ── initial load ──
        showImage(NORMAL_URI);
        status.textContent = '✅ loaded — press SLAP! or hit Spacebar';
    })();
</script>

</body>
      </html>
